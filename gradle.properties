org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Reuse task outputs across builds, and — because the CI setup action persists
# the Gradle user home — across CI jobs. Without it the UI-test job recompiled
# the whole app that the assemble job had compiled minutes earlier, since the
# dependency cache it restored held no compiled output.
#
# Deliberately not `org.gradle.configuration-cache`: the version is resolved by
# shelling out to git during configuration, which is exactly the kind of work
# the configuration cache would freeze and replay with a stale answer.
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
android.nonTransitiveRClass=true
