name: Export Room Schemas

# Room writes a JSON description of the database schema at build time, and
# `MigrationTestHelper` can only create a database at a version whose JSON is
# committed. Generating it requires Room's annotation processor and therefore an
# Android SDK, so this workflow runs the processor and commits the result.
#
# Isolated on purpose. This is the only workflow in the repository with
# `contents: write`, so the ability to push to the default branch is scoped to
# this file and this job rather than granted to the main build.
#
# ## Loop prevention
#
# Three independent guards, because a workflow that pushes to the branch it
# watches is a self-triggering loop by default:
#
# 1. The push uses the automatic `GITHUB_TOKEN`. GitHub does not start workflow
#    runs for events raised by that token, so the commit this job makes cannot
#    trigger any workflow — including this one. This is the load-bearing guard.
# 2. `paths-ignore` excludes `app/schemas/**`, so even a push that somehow
#    carried a different token would not re-enter here if schemas were all it
#    changed.
# 3. The commit step is skipped entirely when the generated schema matches what
#    is already committed, which is the steady state.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "app/schemas/**"
      - "docs/**"
      - "**/*.md"
  # Manual runs are useful for backfilling the current version's JSON, which is
  # exactly what is needed the first time this lands.
  workflow_dispatch:

# Queue rather than cancel: a cancelled run could drop an export that no later
# run regenerates, because the commit that changed the schema is already past.
concurrency:
  group: schema-export
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  export:
    name: Generate and commit schemas
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history and tags: the Gradle build resolves its version from git
          # during configuration, and the rebase below needs real history rather
          # than a shallow clone.
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          # A writable remote for the push below; the default checkout token is
          # scoped to this repository only.
          persist-credentials: true

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Gradle permissions
        run: chmod +x gradlew

      # KSP only needs to process annotations, so this builds no Rust and
      # assembles nothing. One variant is enough: the schema does not vary by
      # build type or flavour.
      - name: Generate schemas
        run: ./gradlew :app:kspProdDebugKotlin --no-daemon

      - name: Detect schema changes
        id: diff
        run: |
          if [[ -n "$(git status --porcelain app/schemas)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Schema files generated or updated:"
            git status --short app/schemas
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Committed schemas already match the generated output."
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/schemas
          git commit -m "chore(schemas): Export Room schema for ${VERSION:0:8}" \
            -m "Generated by the Export Room Schemas workflow. MigrationTestHelper creates a database from the JSON of the version it starts at, so this file must be committed before the schema changes again." \
            --no-verify

          # main may have advanced while the SDK was installing. Rebasing a
          # schema-only commit is safe: it touches no file another commit can.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected, retrying"
            sleep 5
          done
          echo "Could not push after 3 attempts" >&2
          exit 1
