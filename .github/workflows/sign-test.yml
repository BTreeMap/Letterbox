name: Sign Test APK

# Signs the staging APK built from a pull request so testers can install it
# without giving pull-request code access to the production signing key.
#
# This is the most dangerous job in the repository. It runs in the privileged
# `workflow_run` context — the base repository's secrets, not the fork's — and
# its input is an APK built from code nobody has reviewed. If the production
# key ever signed that APK, the result would install over the real app on any
# user's device.
#
# Two things keep that from happening, and the second is new:
#
# 1. No checkout of the built commit. Only the signing action, and only from
#    the default branch. Nothing from the pull request executes here.
# 2. The certificate is read back out of the signed APK and checked against
#    the fingerprint `ci:test` declares. `environment:` selects which keystore
#    a secret resolves to, but an environment that does not define
#    `ANDROID_KEYSTORE_B64` falls back to the repository secret *silently* —
#    so "the environment is configured correctly" was an assumption with
#    nothing checking it. Now it is checked. See `.github/actions/sign-apk`.

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

concurrency:
  group: sign-test-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

# Default deny at the workflow level; each job grants itself the minimum it
# needs. A job added later then starts with no token scopes rather than
# silently inheriting whatever the workflow happened to declare.
permissions: {}

jobs:
  sign-test:
    name: Sign test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ci:test
    permissions:
      contents: read
      # Download artifacts from the triggering workflow run.
      actions: read
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    steps:
      # Deliberately not the pull request's tree: only the signing action, and
      # only from the default branch, which is the same trusted content that
      # defines this workflow.
      - name: Checkout signing action
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "build-tools;37.0.0"

      - name: Download unsigned test APK
        uses: actions/download-artifact@v8
        with:
          name: letterbox-staging-apk
          path: ./artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # A different filename from the release builds, because it is a different
      # app: the staging flavour carries the `.test` applicationId suffix and
      # installs alongside the real one. The APK's own versionName additionally
      # begins `ci-test-untrusted-`.
      - name: Sign
        id: sign
        uses: ./.github/actions/sign-apk
        with:
          apk-directory: ./artifacts
          output-name: letterbox-test.apk
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ vars.ANDROID_KEY_ALIAS }}
          expected-cert-sha256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}

      - name: Upload signed test APK
        uses: actions/upload-artifact@v7
        with:
          name: letterbox-staging-signed-apk
          path: |
            ${{ steps.sign.outputs.apk }}
            ${{ steps.sign.outputs.metadata }}
          retention-days: 14
          if-no-files-found: error
