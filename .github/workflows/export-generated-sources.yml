name: Export Generated Sources

# Two artefacts are generated from sources in this repository and committed
# alongside them, because the build cannot regenerate either at the point it
# needs them:
#
# * `app/schemas/**` — Room writes a JSON description of the database schema at
#   build time, and `MigrationTestHelper` can only create a database at a
#   version whose JSON is committed.
# * `app/src/main/java/org/joefang/letterbox/ffi/**.kt` — UniFFI derives the
#   Kotlin bindings from the *compiled* Rust libraries. They embed a checksum
#   per exported item, and `uniffiCheckApiChecksums` throws on the first FFI
#   call if a committed binding disagrees with the library it loads. Since
#   UniFFI hashes docstrings into those checksums, editing a doc comment on an
#   exported function is enough to break the app at runtime — a failure mode
#   with no compile-time warning and no obvious cause. Regenerating here means
#   the bindings cannot drift from the Rust that produced them.
#
# ## Why two jobs
#
# This is the only workflow in the repository that can write to the default
# branch, so the token that can do it is the most valuable thing in CI. It is
# therefore kept away from every line of code that is not ours to trust.
#
# Generating both artefacts means running Gradle and Cargo, which execute
# arbitrary third-party code by design: Gradle plugins, KSP processors, Cargo
# `build.rs` scripts and proc macros all run as part of an ordinary build. A
# single job would have that code executing while a push-capable token sat in
# `.git/config`, which is a supply-chain compromise away from a commit to
# `main` that nobody wrote.
#
# So `generate` builds with `contents: read` and no persisted credentials, and
# hands its output over as an artefact. `commit` holds the writable token and
# runs no project code at all — it unpacks that artefact, diffs it, and pushes.
# A compromised build dependency can therefore corrupt the *content* of a
# generated file, which review catches, but cannot reach the token.
#
# ## Loop prevention
#
# Three independent guards, because a workflow that pushes to the branch it
# watches is a self-triggering loop by default:
#
# 1. The push uses the automatic `GITHUB_TOKEN`. GitHub does not start workflow
#    runs for events raised by that token, so the commit this job makes cannot
#    trigger any workflow — including this one. This is the load-bearing guard.
# 2. `paths-ignore` excludes every generated path, so even a push that somehow
#    carried a different token would not re-enter here if generated files were
#    all it changed.
# 3. The commit step is skipped entirely when the generated output matches what
#    is already committed, which is the steady state.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "app/schemas/**"
      - "app/src/main/java/org/joefang/letterbox/ffi/**"
      - "docs/**"
      - "**/*.md"
  # Manual runs are useful for backfilling the current version's output, which
  # is exactly what is needed the first time this lands.
  workflow_dispatch:

# Queue rather than cancel: a cancelled run could drop an export that no later
# run regenerates, because the commit that changed the source is already past.
concurrency:
  group: export-generated-sources
  cancel-in-progress: false

# Default deny. Each job below grants itself the minimum it needs, so a new job
# added later starts with nothing rather than inheriting write access.
permissions: {}

env:
  # Where UniFFI writes; it appends the package path from each crate's
  # namespace, yielding `org/joefang/letterbox/ffi/...`.
  BINDINGS_OUT_DIR: app/src/main/java
  GENERATED_PATHS: app/schemas app/src/main/java/org/joefang/letterbox/ffi
  # Handover between the two jobs. A tarball rather than a bare upload so the
  # paths are reproduced exactly; `upload-artifact` would otherwise rebase them
  # on the common ancestor of the two directories.
  BUNDLE: generated-sources.tar.gz

jobs:
  generate:
    name: Generate sources
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history and tags: the Gradle build resolves its version from
          # git during configuration.
          fetch-depth: 0
          fetch-tags: true
          # This job runs untrusted build code. Nothing here needs to talk to
          # the remote, so the token is not left on disk for that code to find.
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      # Bounded input rather than `yes |`, which dies of SIGPIPE once sdkmanager
      # stops reading and would fail this step the moment anyone adds
      # `set -o pipefail` to it.
      - name: Accept Android licenses
        run: printf 'y\n%.0s' {1..100} | sdkmanager --licenses > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Host toolchain only. UniFFI reads the exported metadata out of a
      # compiled library, and that metadata is target-independent, so the
      # bindings do not require the Android NDK or cargo-ndk.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # `cargo build` with no profile flag is the same identity `build.yml`'s
      # Rust job produces — dev profile, host triple, same workspace — so this
      # names that key and restores it instead of compiling the graph again.
      # It does not write: one identity, one producer. Both workflows run on a
      # push to `main`, and two jobs racing to save the same key just means one
      # of them uploads for nothing.
      - name: Cache Rust (host-dev)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-dev
          save-if: false

      # KSP only needs to process annotations, so this builds no Rust and
      # assembles nothing. One variant is enough: the schema does not vary by
      # build type or flavour.
      - name: Generate Room schemas
        run: ./gradlew :app:kspProdDebugKotlin --no-daemon

      - name: Build host libraries
        run: cargo build --package letterbox-core --package letterbox-proxy

      # `--no-format` on purpose: with ktlint installed UniFFI reformats its
      # output, so whether the runner happens to have it decides the bytes on
      # disk. Pinning the raw generator output keeps the committed files a
      # function of the Rust alone.
      - name: Generate UniFFI bindings
        run: |
          set -euo pipefail
          cargo run --package letterbox-core --bin uniffi-bindgen -- \
            generate --library target/debug/libletterbox_core.so \
            --language kotlin --no-format --out-dir "$BINDINGS_OUT_DIR"
          cargo run --package letterbox-proxy --bin uniffi-bindgen-proxy -- \
            generate --library target/debug/libletterbox_proxy.so \
            --language kotlin --no-format --out-dir "$BINDINGS_OUT_DIR"

      - name: Package generated sources
        run: tar -czf "$BUNDLE" -- $GENERATED_PATHS

      - name: Upload generated sources
        uses: actions/upload-artifact@v7
        with:
          name: generated-sources
          path: ${{ env.BUNDLE }}
          retention-days: 1
          if-no-files-found: error

  commit:
    name: Commit generated sources
    needs: generate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Real history for the rebase below.
          fetch-depth: 0
          # No submodules and no toolchains: this job runs nothing but git.
          # The writable token is deliberately the only privileged thing here.
          persist-credentials: true

      - name: Download generated sources
        uses: actions/download-artifact@v8
        with:
          name: generated-sources

      - name: Unpack generated sources
        run: |
          set -euo pipefail
          # Restrict extraction to the paths this workflow owns, so a tarball
          # that somehow carried anything else cannot overwrite tracked source.
          tar -xzf "$BUNDLE" -- $GENERATED_PATHS
          rm -f "$BUNDLE"

      - name: Detect changes
        id: diff
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain -- $GENERATED_PATHS)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Generated sources differ from what is committed:"
            git status --short -- $GENERATED_PATHS
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Committed sources already match the generated output."
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only ever the generated paths. `git add -A` here would let anything
          # the extraction produced reach a commit.
          git add -- $GENERATED_PATHS
          git commit -m "chore(generated): Export generated sources for ${VERSION:0:8}" \
            -m "Generated by the Export Generated Sources workflow. Room schema JSON must be committed before the schema changes again, because MigrationTestHelper creates a database from the JSON of the version it starts at. UniFFI bindings must match the library they load, because their embedded checksums are asserted on the first FFI call." \
            --no-verify

          # main may have advanced while the build ran. Rebasing a
          # generated-only commit is safe: it touches no file another commit
          # can, since sources under these paths are never hand-edited.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected, retrying"
            sleep 5
          done
          echo "Could not push after 3 attempts" >&2
          exit 1
