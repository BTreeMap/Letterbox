[package]
name = "letterbox-proxy"
version = "0.1.0"
edition = "2021"
description = "Privacy-preserving image proxy using Cloudflare WARP over MASQUE"
readme = "README.md"

[lib]
name = "letterbox_proxy"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen-proxy"
path = "uniffi-bindgen.rs"

[features]
default = []
# Enable mock mode for testing without real network
mock = []

[dependencies]
# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros", "fs"] }
futures = "0.3"

# HTTP client for WARP provisioning (runs outside tunnel)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "cookies"] }

base64 = "0.23"

# P-256 keys for MASQUE enrolment.
#
# p256 0.13 took its randomness as `rand_core` 0.6, a different and
# incompatible core from the one `rand` exposes, so the crate had to carry both
# and name the older one directly. 0.14 takes `rand::CryptoRng`, so there is
# one source of randomness again and `rand_core` is gone from this manifest.
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
rand = "0.10"

# MASQUE tunnel (CONNECT-IP over HTTP/3), derived from usque-rs.
#
# This is the only transport. A userspace WireGuard stack (boringtun) sat beside
# it until MASQUE was verified on Android; removing it also removed x25519-dalek,
# since Cloudflare's registration endpoint accepts 32 opaque bytes and does no
# curve arithmetic with them.
usque-core = { path = "../usque-core" }

# TCP/IP stack
#
# The `std` feature is required so that smoltcp's `SocketSet`, socket buffers
# and interface storage can use owned (`Vec`-backed) `ManagedSlice` storage.
# This lets the tunnel own all of its smoltcp storage for its whole lifetime
# without resorting to `Box::leak` for `'static` borrows. Name resolution runs
# over DNS-over-HTTPS through the tunnel, so only the TCP socket is needed.
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "async"] }

# TLS for HTTPS connections
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# URL parsing
url = "2.5"

# Content-Encoding for tunnelled fetches.
#
# Not a bandwidth optimisation: a client that advertises `Accept-Encoding:
# identity` is marked as automation before any other header is read, and the
# 403s that follow are what kept remote images from loading. Advertising
# compression means being able to undo it.
#
# `default-features = false` plus `rust_backend` keeps this pure Rust
# (miniz_oxide). The zlib backends would add a C dependency to a library that is
# cross-compiled for three Android ABIs.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

# Logging
log = "0.4"
env_logger = "0.11"

# UniFFI for Kotlin bindings
uniffi = { version = "0.32", features = ["cli"] }

# Caching
lru = "0.18"

# Time handling
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.15"
tempfile = "3"
once_cell = "1"
wiremock = "0.6"
