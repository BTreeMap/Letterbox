[package]
name = "letterbox-proxy"
version = "0.1.0"
edition = "2021"
description = "Privacy-preserving image proxy using Cloudflare WARP over WireGuard"
readme = "README.md"

[lib]
name = "letterbox_proxy"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen-proxy"
path = "uniffi-bindgen.rs"

[features]
default = []
# Enable mock mode for testing without real network
mock = []

[dependencies]
# Error handling
thiserror = "2.0.18"
anyhow = "1.0.101"

# Async runtime
tokio = { version = "1.49.0", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros", "fs"] }
futures = "0.3.31"

# HTTP client for WARP provisioning (runs outside tunnel)
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "cookies"] }

base64 = "0.22.1"

# P-256 keys for MASQUE enrolment. rand_core 0.6 is pinned by p256 0.13's
# signature of `SigningKey::random`; the workspace's rand 0.10 is a different,
# incompatible core and cannot be substituted here.
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rand = "0.10.0"

# MASQUE tunnel (CONNECT-IP over HTTP/3), derived from usque-rs.
#
# This is the only transport. A userspace WireGuard stack (boringtun) sat beside
# it until MASQUE was verified on Android; removing it also removed x25519-dalek,
# since Cloudflare's registration endpoint accepts 32 opaque bytes and does no
# curve arithmetic with them.
usque-core = { path = "../usque-core" }

# TCP/IP stack
#
# The `std` feature is required so that smoltcp's `SocketSet`, socket buffers
# and interface storage can use owned (`Vec`-backed) `ManagedSlice` storage.
# This lets the tunnel own all of its smoltcp storage for its whole lifetime
# without resorting to `Box::leak` for `'static` borrows. Name resolution runs
# over DNS-over-HTTPS through the tunnel, so only the TCP socket is needed.
smoltcp = { version = "0.13.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp"] }

# TLS for HTTPS connections
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std"] }
webpki-roots = "1.0.6"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# URL parsing
url = "2.5.8"

# Logging
log = "0.4.29"
env_logger = "0.11.8"

# UniFFI for Kotlin bindings
uniffi = { version = "0.31.0", features = ["cli"] }

# Caching
lru = "0.18.0"

# Time handling
chrono = { version = "0.4.43", default-features = false, features = ["std", "clock"] }

[build-dependencies]
uniffi = { version = "0.31.0", features = ["build"] }

[dev-dependencies]
tokio-test = "0.4.5"
mockall = "0.15.0"
tempfile = "3.24.0"
once_cell = "1.21.3"
wiremock = "0.6.5"
